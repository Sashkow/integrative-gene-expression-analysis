# Phase 2B: Progressive-tax block-mask CV
# Based on 6ds article config. Every gene is masked down to the coverage
# of the poorest gene (n_min datasets kept, rest masked).
# Tests: "what if every gene were as sparse as the worst-covered one?"

paths:
  mapped_data: "data/mapped/yehor/8_yehor_preprocessed_datasets_enriched_sashko"
  phenodata: "data/mapped/yehor/8_yehor_preprocessed_datasets_enriched_sashko/phenodata_placenta_1_2_enriched_sashko.tsv"
  output: "output/yehor_sashko/hard_block_mask_cv/progressive_tax"
  column_map:
    arraydatafile_exprscolumnnames: "sample_id"
    secondaryaccession: "dataset_id"
    Gestational.Age.Category: "trimester"
    Diagnosis: "condition"

files:
  suffix: "_entrez_protein_coding"
  file_map:
    GSE28551: "GSE28551_entrez_protein_coding.tsv"
  datasets:
    - "GSE100051"
    - "GSE122214"
    - "GSE28551"
    - "GSE37901"
    - "GSE93520"
    - "GSE9984"

sample_filter:
  condition: ["healthy"]
  trimester: ["First trimester", "Second trimester"]

phenotype:
  group_column: "trimester"
  baseline: "First trimester"
  contrast: "Second trimester"
  covariates: ["fetux_sex_estimate"]

imputation:
  softimpute:
    enabled: true
    rank_max: 30
    lambda: 0
    thresh: 1e-4
    maxit: 50
    type: "als"
  none:
    enabled: true

normalization:
  combat_ref:
    enabled: true
    ref_batch: "GSE100051"

coverage:
  min_datasets: 2
  drop_imputed_genes_missing_in_group: true

de:
  imputed_cell_weight: 0.0

thresholds:
  fdr: 0.05
  logfc: 1.0

gene_filter:
  protein_coding_only: true
  min_variance: 0.01

validation:
  leave_out_fraction: 0.1
  n_repeats: 3
  mask_type: "progressive_tax_block"
  min_obs_per_gene: 1

output:
  save_imputed_matrices: true
  save_normalized_matrices: true
  save_validation_report: true
  save_comparison_plots: true

logging:
  verbose: true
  save_log: true
