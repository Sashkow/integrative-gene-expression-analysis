# Phase 2B: Yehor 6-dataset 1_2 trimester comparison — batch_in_limma + Soncin 1T weeks 6-10
# Same 6 datasets as 6ds_no_37653_no_22490_enriched_sashko
# batch_in_limma instead of ComBat, GSE100051 first trimester restricted to weeks 6-10
# GSE37653 excluded
# GSE22490 excluded (decidual contamination in tissue protocol)
# GSE70102 excluded (basal plate tissue)

paths:
  mapped_data: "data/mapped/yehor/8_yehor_preprocessed_datasets_enriched_sashko"
  phenodata: "data/mapped/yehor/8_yehor_preprocessed_datasets_enriched_sashko/phenodata_placenta_1_2_enriched_sashko.tsv"
  output: "output/yehor_sashko/phase2b_1_2_yehor_6ds_batch_in_limma_soncin_6_10w"
  column_map:
    arraydatafile_exprscolumnnames: "sample_id"
    secondaryaccession: "dataset_id"
    Gestational.Age.Category: "trimester"
    Diagnosis: "condition"

files:
  suffix: "_entrez_protein_coding"
  file_map:
    GSE28551: "GSE28551_entrez_protein_coding.tsv"
  datasets:
    - "GSE100051"
    - "GSE122214"
    - "GSE28551"
    - "GSE37901"
    - "GSE93520"
    - "GSE9984"

sample_filter:
  condition: ["healthy"]
  trimester: ["First trimester", "Second trimester"]

per_dataset_filter:
  GSE100051:
    fetus_week: [6, 7, 8, 9, 10, 14, 16]

phenotype:
  group_column: "trimester"
  baseline: "First trimester"
  contrast: "Second trimester"
  covariates: ["fetux_sex_estimate"]

imputation:
  softimpute:
    enabled: true
    rank_max: 30
    lambda: 0
    thresh: 1e-4
    maxit: 50
    type: "als"
  none:
    enabled: true

normalization:
  batch_in_limma:
    enabled: true

coverage:
  min_datasets: 1
  drop_imputed_genes_missing_in_group: true

de:
  imputed_cell_weight: 0.0

thresholds:
  fdr: 0.05
  logfc: 1.0

gene_filter:
  protein_coding_only: true
  min_variance: 0.01

validation:
  leave_out_fraction: 0.1
  n_repeats: 3
  mask_type: "gene_dataset_block"

output:
  save_imputed_matrices: true
  save_normalized_matrices: true
  save_validation_report: true
  save_comparison_plots: true

logging:
  verbose: true
  save_log: true
