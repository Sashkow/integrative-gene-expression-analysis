# =============================================================================
# Enriched dataset pack for Yehor (8 datasets, GSE70102 excluded)
# =============================================================================
# Location: data/mapped/yehor/8_yehor_preprocessed_datasets_enriched_sashko/
#
# Based on Yehor's 2026-04-27 preprocessing of 9 datasets, with:
#   - GSE70102 removed (basal plate tissue, not villi; 4 healthy 2nd-trimester samples)
#   - GSE28551 replaced with Sashko's preprocessing (10437 vs 11013 genes)
#   - GSE37653 filtered to Singapore batch only (12 of 25 samples)
#     + Kept only "Dec 2009 Singapore v2.5" scanning batch (12 samples, 6f/6m)
#     + Dropped India v2.5 (6), India v2.6 (4), No header (3) — scanning facility batch effects
#     + No ComBat needed — single batch
#     + Khan et al. 2014 (PMID 24604048) does not discuss scanning batches
#   - phenodata: phenodata_placenta_1_2_enriched_sashko.tsv (173 rows)
#     + Added columns: Batch (GSE37653 scanning batches), Estimated.Smoking.Status (GSE28551)
#     + GSE28551 smoking: 9 Smoker, 7 Non-Smoker (1st trimester), inferred via clustering
#       on 18 smoking-responsive genes (see scripts/per_dataset_scripts/GSE28551/estimate_smoking_status.R)
#
# PCA plots: output/per_dataset_pca/8_yehor_enriched_sashko/
#
# Datasets included (8):
#   GSE100051 — Yehor preprocessing
#   GSE122214 — Yehor preprocessing
#   GSE22490  — Yehor preprocessing
#   GSE28551_enriched_sashko  — Sashko preprocessing (smoking status estimated)
#   GSE37653_enriched_sashko  — Yehor preprocessing, Singapore batch only (12 samples)
#   GSE37901  — Yehor preprocessing
#   GSE93520  — Yehor preprocessing
#   GSE9984   — Yehor preprocessing
